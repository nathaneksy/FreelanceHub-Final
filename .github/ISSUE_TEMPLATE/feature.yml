name: Feature task
description: Define a small piece of team work
body:
  - type: textarea
    id: problem
    attributes:
      label: User need
    validations:
      required: true
  - type: textarea
    id: criteria
    attributes:
      label: Acceptance criteria
      description: Describe observable behavior, affected roles, and permission rules.
    validations:
      required: true
  - type: textarea
    id: dependencies
    attributes:
      label: Dependencies and proposed implementation
